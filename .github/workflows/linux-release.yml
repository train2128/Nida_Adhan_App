name: Linux release (DEB + AppImage)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-jammy:
    # Oldest still-supported Ubuntu LTS -> glibc 2.35 baseline so the
    # AppImage runs on all supported distros. Do NOT move to ubuntu-latest.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 + tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ \
            qt6-base-dev qt6-multimedia-dev qt6-base-dev-tools \
            libqt6sql6-sqlite libgl1-mesa-dev \
            fuse libfuse2 file desktop-file-utils appstream

      - name: Configure (prefix /usr is required for AppImages)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build --parallel

      - name: Smoke check (glibc baseline)
        run: |
          ./build/Nida --version || true
          echo "--- glibc requirements of built binary ---"
          objdump -T build/Nida | grep -oE 'GLIBC_[0-9.]+' | sort -Vu || true

      - name: Install to AppDir
        run: |
          rm -rf AppDir
          DESTDIR="$PWD/AppDir" cmake --install build
          # linuxdeploy expects the desktop file + icon at AppDir root
          cp packaging/nida.desktop AppDir/
          cp resources/icons/icon_colored.png AppDir/nida.png
          cp resources/icons/icon_colored.png AppDir/.DirIcon
          # metainfo is already installed by CMake under usr/share/metainfo

      - name: Fetch linuxdeploy
        run: |
          wget -q -O linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          ./linuxdeploy --appimage-extract-and-run --help >/dev/null

      - name: Build AppImage (uruntime, no libfuse2 runtime dep)
        env:
          LDAI_UPDATE_INFORMATION: ""
          # Jammy's default /usr/bin/qmake is Qt5; point the Qt plugin at Qt6.
          QMAKE: /usr/bin/qmake6
        run: |
          ./linuxdeploy --appdir AppDir --plugin qt --output appimage
          ls -lh Nida-*.AppImage
          ./Nida-*.AppImage --appimage-extract-and-run --version || true

      - name: Build DEB + tarball
        # Explicit generators: the CMake default also includes RPM, whose
        # toolchain (rpmbuild) is not installed here.
        run: |
          (cd build && cpack -G DEB && cpack -G TGZ)
          ls -lh build/*.deb build/*.tar.gz || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nida-1.1.0-jammy
          path: |
            Nida-*.AppImage
            build/*.deb
            build/*.tar.gz
